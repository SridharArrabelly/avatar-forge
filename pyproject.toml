[project]
name = "avatar-forge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "azure-ai-projects>=2.4.0",
    "azure-ai-voicelive[aiohttp]>=1.2.0",
    "azure-core>=1.41.0",
    "azure-identity>=1.26.0b2",
    "azure-search-documents>=12.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.52.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.1",
    "azure-communication-callautomation>=1.6.0",
    "azure-communication-identity>=1.5.0",
    # Decodes the Voice Live avatar stream (fragmented MP4: H.264 + AAC) into the
    # NV12 frames the Teams meeting bot's VideoSocket needs and PCM16 for the
    # outbound audio path. Ships manylinux wheels, so it runs on the Linux
    # Container App and keeps the Windows media bot free of any decoder.
    "av>=18.0.0",
]

# Needed only by AUDIT_SINK=cosmos, which cannot be reached unless ENABLE_AUDIT
# is true — and audit is off by default. `backend/audit/cosmos.py` imports the
# SDK lazily inside `_connect()`, so nothing touches `azure.cosmos` until a
# Cosmos sink is actually built.
#
# Keeping it out of the required set matters on restricted networks: every azd
# hook shells out to `uv run`, which syncs first, so one unreachable wheel fails
# `azd provision` outright — even with audit disabled and no Cosmos in the
# deployment. A dependency that most deployments never use must not be able to
# block all of them.
#
# The container image installs this extra (see Dockerfile), so a deployed app
# can always write to Cosmos. Locally: `uv sync --extra cosmos`.
[project.optional-dependencies]
cosmos = ["azure-cosmos>=4.16.3"]

[tool.uv]
prerelease = "allow"
package = true

[project.scripts]
avatar-forge = "backend.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.api", "backend.voice", "backend.acs"]
